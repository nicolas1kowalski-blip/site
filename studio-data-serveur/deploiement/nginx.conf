# Reverse proxy nginx — /etc/nginx/sites-available/studio-data
# TLS à terminer ici (certbot ou certificat interne) ; le serveur Node n'écoute qu'en local.
server {
    listen 443 ssl http2;
    server_name studio-data.exemple.fr;

    ssl_certificate     /etc/letsencrypt/live/studio-data.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio-data.exemple.fr/privkey.pem;

    # Dépôt de fichiers volumineux (CSV de plusieurs Go) : pas de limite nginx, pas de mise en tampon.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    location / {
        proxy_pass http://127.0.0.1:8420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name studio-data.exemple.fr;
    return 301 https://$host$request_uri;
}
