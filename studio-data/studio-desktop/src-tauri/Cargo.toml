[package]
name = "studio-data-desktop"
version = "0.1.0"
description = "Studio Data — démonstrateur de data gouvernance (version bureau, DuckDB natif)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"          # sélecteur de fichiers natif (phase 2)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# DuckDB natif embarqué (compile DuckDB depuis les sources via la feature "bundled").
# La feature "json" permet d'exporter directement des lignes en JSON pour le pont front.
duckdb = { version = "1", features = ["bundled"] }

[profile.release]
opt-level = "s"     # binaire compact
lto = true
strip = true

[[bin]]
name = "studio-data-desktop"
path = "src/main.rs"
